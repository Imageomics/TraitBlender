---
# Morphospace hyperparameters. Active morphospace: bpy.data.scenes["Scene"].traitblender_setup.available_morphospaces (default Shell (Default))
morphospace:
  name: Shell (Default)
  hyperparams:
    n_vertices_aperture: 10
    time_step: 0.15
    use_inner_surface: false
dataset:
  filepath: ""
world:
  color: [0.0, 0.0, 0.0, 1.0]
  strength: 1.0
camera:
  location: [0.0, 0.0, 1.1]
  aspect_x: 1.0
  aspect_y: 1.0
  camera_type: PERSP
  focal_length: 60.0
  lens_unit: MILLIMETERS
  resolution_percentage: 100
  resolution_x: 1080
  resolution_y: 1080
  rotation: [0.0, 0.0, 0.0]
  shift_x: 0.0
  shift_y: 0.0
lamp:
  location: [0.0, 0.0, 1.0]
  beam_blend: 0.0
  beam_size: 1.0
  color: [1.0, 1.0, 1.0]
  diffuse: 1.0
  power: 10.0
  rotation: [0.0, 0.0, 0.0]
  scale: [1.0, 1.0, 1.0]
  shadow: true
  use_soft_falloff: true
ruler:
  tb_location: [0.0, -0.1, 0.0]
  tb_rotation: [0.0, 0.0, 0.0]
  hide: false
mat:
  color: [0.0, 0.0, 0.0, 1.0]
  tb_location: [0.0, 0.0, 0.0]
  tb_rotation: [0.0, 0.0, 0.0]
  roughness: 1.0
  scale: [0.15, 0.15, 1.0]
render:
  # Eevee id is version-specific (BLENDER_EEVEE_NEXT vs BLENDER_EEVEE); both accepted in YAML.
  engine: BLENDER_EEVEE
  eevee:
    use_raytracing: false
    taa_render_samples: 64
  # When engine is CYCLES, export uses a cycles: block instead, e.g.:
  # cycles:
  #   use_adaptive_sampling: true
  #   adaptive_threshold: 0.01
  #   samples: 4096
  #   adaptive_min_samples: 0
  #   time_limit: 0.0
output:
  image_format: PNG
  images_per_view: 1
  output_directory: ""
  output_type: image
metadata:
  stamp_note_text: ""
  use_stamp_camera: true
  use_stamp_date: true
  use_stamp_filename: true
  use_stamp_frame: true
  use_stamp_frame_range: false
  use_stamp_hostname: false
  use_stamp_lens: false
  use_stamp_marker: false
  use_stamp_memory: false
  use_stamp_note: false
  use_stamp_render_time: true
  use_stamp_scene: true
  use_stamp_sequencer_strip: false
  use_stamp_time: true
transforms:
  [] 